<svg xmlns="http://www.w3.org/2000/svg" width="1414" height="1000" viewBox="0 0 1414 1000" role="img" aria-labelledby="title description">
  <title id="title">SmileCraft Dental Clinic project poster</title>
  <desc id="description">Landscape poster for SmileCraft, a single Indian dental clinic with Rohini and Pitampura branches, shared patient records, branch-specific appointments, and assigned doctors.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#452457"/>
      <stop offset="1" stop-color="#754192"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c8b3"/>
      <stop offset="1" stop-color="#b3eee0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#44265a" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .eyebrow{font-size:13px;font-weight:800;letter-spacing:1.8px}
      .section{font-size:17px;font-weight:800;letter-spacing:.55px;fill:#452457}
      .body{font-size:14px;fill:#51465c}
      .small{font-size:11.5px;fill:#74677b}
      .feature-title{font-size:13px;font-weight:750;fill:#382847}
      .feature-body{font-size:11.5px;fill:#74677b}
      .pill{font-size:10px;font-weight:800;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1414" height="1000" fill="#f7f4f9"/>
  <rect width="1414" height="142" fill="#fff"/>
  <image href="poster-assets/hmr-institute-banner.png" x="48" y="23" width="500" height="116" preserveAspectRatio="xMinYMid meet"/>
  <text x="1360" y="62" text-anchor="end" class="eyebrow" fill="#8b55a1">ACADEMIC PROJECT</text>
  <text x="1360" y="88" text-anchor="end" class="small">HMR Institute of Technology &amp; Management</text>
  <text x="1360" y="108" text-anchor="end" class="small">Hamidpur, Delhi-110036</text>
  <path d="M0 142h1414v8H0z" fill="url(#accent)"/>

  <rect y="150" width="1414" height="218" fill="url(#header)"/>
  <circle cx="1280" cy="175" r="155" fill="#fff" opacity=".045"/>
  <circle cx="1390" cy="335" r="98" fill="#c6f4e8" opacity=".09"/>
  <g transform="translate(93 202)">
    <circle cx="42" cy="42" r="39" fill="#fff" opacity=".14"/>
    <path d="M42 13c-11-10-29-4-31 13-2 17 7 44 17 45 7 0 6-21 14-21s7 21 14 21c10-1 19-28 17-45-2-17-20-23-31-13z" fill="none" stroke="#d7fff4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M22 42h40M42 22v40" stroke="#74dcc8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="190" y="218" fill="#c9f4e9" class="eyebrow">DENTAL CLINIC MANAGEMENT • INDIA</text>
  <text x="186" y="278" fill="#fff" font-size="54" font-weight="850" letter-spacing="-1.7">SmileCraft Dental Clinic</text>
  <text x="190" y="316" fill="#f0e5f6" font-size="21">One clinic across Rohini &amp; Pitampura, with shared patient records.</text>
  <g transform="translate(1135 190)">
    <rect width="186" height="145" rx="22" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".2"/>
    <rect x="22" y="19" width="142" height="86" rx="9" fill="#fff"/>
    <rect x="32" y="30" width="51" height="18" rx="5" fill="#efe6f3"/>
    <rect x="32" y="56" width="58" height="38" rx="6" fill="#e8f8f3"/>
    <rect x="98" y="30" width="55" height="64" rx="6" fill="#f7f2fa"/>
    <path d="M40 82h39M40 74h28M108 43h34M108 54h29M108 65h34M108 76h22" stroke="#9d7eae" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="140" cy="105" r="19" fill="#55cbb3" stroke="#684080" stroke-width="4"/>
    <path d="M133 105l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="130" fill="#fff" font-size="10" font-weight="750" text-anchor="middle" letter-spacing="1">CARE, CONNECTED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="393" width="1302" height="104" rx="18" fill="#fff"/>
  </g>
  <text x="84" y="426" class="eyebrow" fill="#8b55a1">THE CHALLENGE</text>
  <text x="84" y="459" class="section" font-size="20">Clinic work is easier when essential tools work together.</text>
  <text x="720" y="439" class="body">Appointments, patient information, follow-ups, billing and supplies can be hard to track</text>
  <text x="720" y="463" class="body">across locations. SmileCraft shares patient history and assigns appointments by branch.</text>

  <text x="60" y="548" class="eyebrow" fill="#8b55a1">BUILT FOR THE DAILY FLOW OF A CLINIC</text>
  <text x="60" y="577" class="section" font-size="21">Two connected experiences. One shared clinic record.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="600" width="420" height="253" rx="18" fill="#fff"/>
    <rect x="497" y="600" width="420" height="253" rx="18" fill="#fff"/>
    <rect x="938" y="600" width="420" height="253" rx="18" fill="#fff"/>
  </g>
  <rect x="56" y="600" width="420" height="7" rx="3.5" fill="#8851a0"/>
  <rect x="497" y="600" width="420" height="7" rx="3.5" fill="#50bda9"/>
  <rect x="938" y="600" width="420" height="7" rx="3.5" fill="#d2a15a"/>

  <circle cx="89" cy="635" r="17" fill="#f1e8f5"/>
  <path d="M80 641v-10l9-6 9 6v10h-6v-7h-5v7z" fill="none" stroke="#754192" stroke-width="2" stroke-linejoin="round"/>
  <text x="116" y="632" class="section" font-size="15">CLINIC TEAM</text>
  <text x="116" y="651" class="small">Rohini: Dr Sameer  •  Pitampura: Dr Aarav</text>
  <g>
    <circle cx="82" cy="680" r="3.5" fill="#8851a0"/><text x="96" y="684" class="feature-title">Appointments</text><text x="96" y="700" class="feature-body">Branch-based bookings; prevent duplicate active slots</text>
    <circle cx="82" cy="722" r="3.5" fill="#8851a0"/><text x="96" y="726" class="feature-title">Patient records</text><text x="96" y="742" class="feature-body">Shared history across Rohini &amp; Pitampura</text>
    <circle cx="82" cy="764" r="3.5" fill="#8851a0"/><text x="96" y="768" class="feature-title">Treatments &amp; follow-ups</text><text x="96" y="784" class="feature-body">Track procedures, care and follow-up dates</text>
    <circle cx="82" cy="806" r="3.5" fill="#8851a0"/><text x="96" y="810" class="feature-title">Billing, reports &amp; inventory</text><text x="96" y="826" class="feature-body">INR invoices, optional GST, low-stock alerts</text>
  </g>

  <circle cx="530" cy="635" r="17" fill="#e3f7f1"/>
  <circle cx="525" cy="632" r="4" fill="none" stroke="#258d7b" stroke-width="1.8"/>
  <path d="M518 644c0-5 3-8 7-8s7 3 7 8M540 628a4 4 0 0 1 0 8M542 638c4 1 6 3 6 6" fill="none" stroke="#258d7b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="557" y="632" class="section" font-size="15">PATIENT PORTAL</text>
  <text x="557" y="651" class="small">Secure access linked to the clinic record</text>
  <g>
    <circle cx="523" cy="680" r="3.5" fill="#43ad9b"/><text x="537" y="684" class="feature-title">Appointments</text><text x="537" y="700" class="feature-body">Request, review or manage eligible visits</text>
    <circle cx="523" cy="722" r="3.5" fill="#43ad9b"/><text x="537" y="726" class="feature-title">Health records</text><text x="537" y="742" class="feature-body">View notes, treatments and prescriptions</text>
    <circle cx="523" cy="764" r="3.5" fill="#43ad9b"/><text x="537" y="768" class="feature-title">Billing</text><text x="537" y="784" class="feature-body">Review invoices and save or print PDFs</text>
    <circle cx="523" cy="806" r="3.5" fill="#43ad9b"/><text x="537" y="810" class="feature-title">Appointment reminders</text>
    <rect x="537" y="815" width="101" height="22" rx="11" fill="#fff3d8"/>
    <text x="587" y="830" class="pill" fill="#9b6711" text-anchor="middle">IN PROGRESS</text>
  </g>

  <circle cx="971" cy="635" r="17" fill="#fff3df"/>
  <path d="M971 625l3 7 7 .5-5.5 4.5 1.8 7-6.3-3.8-6.3 3.8 1.8-7-5.5-4.5 7-.5z" fill="none" stroke="#aa7933" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="998" y="632" class="section" font-size="15">SMART SUPPORT</text>
  <text x="998" y="651" class="small">Helpful tools for clinic teams</text>
  <g>
    <circle cx="964" cy="680" r="3.5" fill="#d2a15a"/><text x="978" y="684" class="feature-title">AI clinic assistant</text><text x="978" y="700" class="feature-body">Find follow-ups; answer general oral-health questions</text>
    <circle cx="964" cy="722" r="3.5" fill="#d2a15a"/><text x="978" y="726" class="feature-title">Voice input</text><text x="978" y="742" class="feature-body">Ask questions by voice where browser-supported</text>
    <circle cx="964" cy="764" r="3.5" fill="#d2a15a"/><text x="978" y="768" class="feature-title">Web-based application</text><text x="978" y="784" class="feature-body">React · Vite · Node.js · Express · MongoDB</text>
    <circle cx="964" cy="806" r="3.5" fill="#d2a15a"/><text x="978" y="810" class="feature-title">Connected workflow</text><text x="978" y="826" class="feature-body">Shared records • branch doctors • branch-specific appointments</text>
  </g>

  <g>
    <rect x="56" y="880" width="1302" height="72" rx="15" fill="#eee7f2"/>
    <text x="78" y="907" class="eyebrow" fill="#754192">IMPORTANT</text>
    <text x="220" y="906" class="small">The AI assistant provides general information, not diagnosis. Appointment reminders are in progress.</text>
    <text x="220" y="928" class="small">Payment processing and insurance claims are not integrated. Review privacy and regulatory needs before real clinical use.</text>
  </g>
  <text x="60" y="981" class="small" font-weight="700">TEAM: __________________________</text>
  <text x="515" y="981" class="small" font-weight="700">PROJECT GUIDE / COURSE: __________________________</text>
  <rect x="1284" y="960" width="65" height="30" rx="4" fill="none" stroke="#baaac3" stroke-dasharray="4 3"/>
  <text x="1316" y="980" class="small" text-anchor="middle">QR</text>
</svg>
