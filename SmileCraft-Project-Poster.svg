<svg xmlns="http://www.w3.org/2000/svg" width="1414" height="1000" viewBox="0 0 1414 1000" role="img" aria-labelledby="title description">
  <title id="title">SmileCraft Dental Clinic project poster</title>
  <desc id="description">Landscape academic poster presenting SmileCraft, an Indian dental clinic system for the Rohini and Pitampura branches, with shared patient records and branch-specific appointments.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1459a6"/>
      <stop offset="1" stop-color="#103f7d"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d5e0ed"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18395e" flood-opacity=".07"/>
    </filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .eyebrow{font-size:13px;font-weight:800;letter-spacing:1.55px}
      .section{font-size:19px;font-weight:800;letter-spacing:.55px;fill:#194777}
      .body{font-size:15px;fill:#453b51}
      .small{font-size:12px;fill:#675d72}
      .feature-title{font-size:15px;font-weight:750;fill:#352a43}
      .feature-body{font-size:13px;fill:#61576d}
      .chip{font-size:14px;font-weight:700;fill:#245487}
      .step{font-size:15px;font-weight:750;fill:#194777}
    </style>
  </defs>

