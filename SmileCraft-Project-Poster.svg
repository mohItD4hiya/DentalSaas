  <text x="559" y="854" class="step" text-anchor="middle">Staff manages</text>
  <text x="559" y="875" class="step" text-anchor="middle">shared records</text>
  <text x="780" y="854" class="step" text-anchor="middle">Patient selects</text>
  <text x="780" y="875" class="step" text-anchor="middle">a branch and books</text>
  <text x="1001" y="854" class="step" text-anchor="middle">Branch doctor</text>
  <text x="1001" y="875" class="step" text-anchor="middle">confirms the visit</text>
  <text x="1238" y="854" class="step" text-anchor="middle">Clinic tracks care</text>
  <text x="1238" y="875" class="step" text-anchor="middle">and follow-ups</text>
