  <text x="630" y="69" fill="#fff" font-size="39" font-weight="850" letter-spacing="-1">SmileCraft Dental Clinic</text>
  <text x="632" y="103" fill="#eee7f5" font-size="19">A dental clinic management web application for Indian clinics</text>
  <path d="M0 148h1414v7H0z" fill="#0f9b9e"/>

