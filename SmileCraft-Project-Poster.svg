  </g>

  <rect x="60" y="199" width="8" height="22" rx="4" fill="#0f9b9e"/>
  <text x="81" y="216" class="section">THE CHALLENGE</text>
  <text x="61" y="251" class="body">
    <tspan x="61" dy="0">Dental clinics need a simple way to manage</tspan>
    <tspan x="61" dy="23">appointments, patient information, treatments,</tspan>
    <tspan x="61" dy="23">billing and supplies together.</tspan>
  </text>
  <text x="61" y="335" class="body">
    <tspan x="61" dy="0">When one clinic has multiple branches, patient</tspan>
    <tspan x="61" dy="23">history should stay connected while appointments</tspan>
    <tspan x="61" dy="23">and doctor access remain branch-specific.</tspan>
  </text>

