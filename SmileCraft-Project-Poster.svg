  <text x="543" y="271" class="feature-title">Shared patient records</text>
  <text x="543" y="293" class="feature-body">History accessible at Rohini and Pitampura</text>
  <text x="995" y="271" class="feature-title">Branch appointment management</text>
  <text x="995" y="293" class="feature-body">Each booking is assigned to a clinic location</text>

  <text x="543" y="361" class="feature-title">No double-booking</text>
  <text x="543" y="383" class="feature-body">Active slots are protected within each branch</text>
  <text x="995" y="361" class="feature-title">Patient portal</text>
  <text x="995" y="383" class="feature-body">Appointments, visit notes, prescriptions, invoices</text>

  <text x="543" y="451" class="feature-title">Visit notes and care tracking</text>
  <text x="543" y="473" class="feature-body">Treatments and follow-up dates in one record</text>
  <text x="995" y="451" class="feature-title">Billing in Indian rupees</text>
  <text x="995" y="473" class="feature-body">Itemized invoices with optional GST</text>

  <text x="543" y="541" class="feature-title">Inventory management</text>
  <text x="543" y="563" class="feature-body">Track supply usage and low-stock alerts</text>
  <text x="995" y="541" class="feature-title">Reports and analytics</text>
  <text x="995" y="563" class="feature-body">Clinic activity, treatment mix and revenue</text>

  <text x="543" y="631" class="feature-title">Clinic AI assistant</text>
  <text x="543" y="653" class="feature-body">Follow-up queries and general oral-health information</text>
  <text x="995" y="631" class="feature-title">Doctor accounts by branch</text>
  <text x="995" y="653" class="feature-body">Doctors manage appointments at their assigned location</text>

  <rect x="455" y="744" width="8" height="23" rx="4" fill="#0f9b9e"/>
  <text x="477" y="762" class="section">HOW IT WORKS</text>
